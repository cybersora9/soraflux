# Windows release: NSIS installer (with the WebView2 bootstrapper), SHA256 checksums,
# optional SignPath signing, updater signature (Tauri updater) and a DRAFT release.
# Runs manually or on a v* tag. The maintainer publishes the draft after checking it.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # SignPath signing is switched on with the repository variable SIGNPATH_WLACZONE=true
      # ("wlaczone" = enabled) once the application is accepted (docs/SIGNING.md).
      SIGNPATH_WLACZONE: ${{ vars.SIGNPATH_WLACZONE }}
      # The updater private key lives only in repository secrets (docs/UPDATES.md).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tag of this release: the pushed tag, or v<version from tauri.conf.json> for a manual run
      # (latest.json must point at the tag the installer will be published under).
      - name: Release tag
        id: tag
        shell: pwsh
        run: |
          $wersja = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$wersja" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $tag -ne "v$wersja") { throw "Tag $tag does not match version $wersja in tauri.conf.json" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Build (NSIS)
        run: npx tauri build --bundles nsis

      - name: Find the installer
        id: plik
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "sciezka=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "nazwa=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload the installer for signing
        id: niepodpisany
        if: env.SIGNPATH_WLACZONE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: niepodpisany
          path: ${{ steps.plik.outputs.sciezka }}

      - name: SignPath signing (off while SIGNPATH_WLACZONE != true)
        if: env.SIGNPATH_WLACZONE == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: soraflux
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.niepodpisany.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: podpisany

      - name: Replace with the signed installer
        if: env.SIGNPATH_WLACZONE == 'true'
        shell: pwsh
        run: Copy-Item "podpisany/${{ steps.plik.outputs.nazwa }}" "${{ steps.plik.outputs.sciezka }}" -Force

      # The updater signature is computed on the final (possibly signed) installer.
      - name: Updater signature
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: npx tauri signer sign "${{ steps.plik.outputs.sciezka }}"

      # Without the .sig the updater rejects latest.json, so a tagged release must not go out unsigned.
      - name: Require the updater signature on tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ steps.plik.outputs.sciezka }}.sig")) { throw "Missing updater signature: set TAURI_SIGNING_PRIVATE_KEY (docs/UPDATES.md)" }

      - name: latest.json and SHA256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wydanie | Out-Null
          Copy-Item "${{ steps.plik.outputs.sciezka }}*" wydanie/
          node scripts/latest-json.mjs wydanie "${{ github.repository }}" "${{ steps.tag.outputs.tag }}"
          Get-ChildItem wydanie -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii wydanie/SHA256SUMS.txt
          Get-Content wydanie/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: soraflux-windows
          path: wydanie/*

      # A release that already exists (e.g. published by hand with the website installer) is never
      # touched: uploading would replace its files and change the SHA-256 people already verified.
      - name: Check for an existing release
        id: istnieje
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          "jest=$([int]($LASTEXITCODE -eq 0))" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Draft release (tags only, new releases only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.istnieje.outputs.jest == '0'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.tag.outputs.tag }}
          files: wydanie/*

<title>Rodzina Sora GUI 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1+Code:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Układ: strona = przełącznik apek + okno apki 1:1 (Windows 11, własny pasek tytułu) + notatki ze źródłami.
   Wspólne DNA z SoraFluxa: Dela Gothic w tytułach, wciskane przyciski z półką, odczyty LCD, pasek stanu „lokalnie”.
   Każda apka: własny akcent (--akd ciemny / --akl jasny) i własny układ roboczy. Logo zawsze karmazyn Blackwall. */
:root {
  --bg: #0a0a0d; --strona2: #111115;
  --panel: #121216; --panel2: #18181d; --panel3: #1f1f25; --wglebienie: #0c0c0f;
  --line: rgba(246,242,243,.07); --line2: rgba(246,242,243,.13); --line3: rgba(246,242,243,.22);
  --tx: #f4eff1; --tx2: #bdb6b9; --tx3: #8f888c;
  --lcd: #070709; --lcd-line: rgba(255,255,255,.06);
  --ok: #7ad6a4; --warn: #e6b450; --bad: #ff5468; --brand: #e11d33; --kosc: #f6f2f3; --ink: #0e0e12;
  --cien: 0 30px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.4);
  --f-tytul: "Dela Gothic One", "Segoe UI Black", system-ui, sans-serif;
  --f-ui: "M PLUS Rounded 1c", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --f-mono: "M PLUS 1 Code", "Cascadia Code", Consolas, monospace;
  --f-ksiazka: "Literata", Georgia, "Times New Roman", serif;
  --r-s: 6px; --r-m: 10px; --r-l: 14px; --r-xl: 18px;
  --ruch: 170ms cubic-bezier(.2,.7,.2,1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #e9e6e7; --strona2: #f3f1f1;
  --panel: #fbf9fa; --panel2: #f2eff0; --panel3: #e8e4e6; --wglebienie: #ebe7e9;
  --line: rgba(20,18,23,.08); --line2: rgba(20,18,23,.14); --line3: rgba(20,18,23,.24);
  --tx: #151318; --tx2: #48434b; --tx3: #6a646c;
  --ok: #2d724e; --warn: #865e0f; --bad: #c02b3f;
  --cien: 0 30px 70px -24px rgba(40,20,30,.35), 0 0 0 1px rgba(20,18,23,.08);
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #e9e6e7; --strona2: #f3f1f1;
  --panel: #fbf9fa; --panel2: #f2eff0; --panel3: #e8e4e6; --wglebienie: #ebe7e9;
  --line: rgba(20,18,23,.08); --line2: rgba(20,18,23,.14); --line3: rgba(20,18,23,.24);
  --tx: #151318; --tx2: #48434b; --tx3: #6a646c;
  --ok: #2d724e; --warn: #865e0f; --bad: #c02b3f;
  --cien: 0 30px 70px -24px rgba(40,20,30,.35), 0 0 0 1px rgba(20,18,23,.08);
  color-scheme: light;
}
/* akcenty apek */
[data-app="flux"] { --akd: #ff3a52; --akl: #c8102e; }
[data-app="shot"] { --akd: #4cc2ff; --akl: #0b679f; }
[data-app="foto"] { --akd: #5ee0c4; --akl: #0b6b5e; }
[data-app="pdf"]  { --akd: #ffb547; --akl: #955400; }
[data-app="czyt"] { --akd: #b9a3ff; --akl: #5a3ec2; }
[data-app] { --ak: var(--akd); --ak-na: #120a0d; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) [data-app] { --ak: var(--akl); --ak-na: #ffffff; } }
:root[data-theme="light"] [data-app] { --ak: var(--akl); --ak-na: #ffffff; }
[data-app] { --ak-slaby: color-mix(in oklab, var(--ak) 15%, transparent); --ak-linia: color-mix(in oklab, var(--ak) 45%, transparent); --ak-polka: color-mix(in oklab, var(--ak) 55%, #000); }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--tx); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; padding: 28px 20px 60px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ak, #ff3a52); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.ukryj { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- nagłówek strony ---------- */
.glowa { max-width: 1240px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.glowa h1 { font-family: var(--f-tytul); font-weight: 400; font-size: clamp(26px, 4vw, 40px); line-height: 1; margin: 0; letter-spacing: .005em; }
.glowa h1 span { color: var(--brand); }
.glowa p { margin: 8px 0 0; color: var(--tx2); max-width: 62ch; }
.motyw-przel { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line2); }
.motyw-przel button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--tx2); font-size: 13px; font-weight: 600; }
.motyw-przel button[aria-pressed="true"] { background: var(--panel); color: var(--tx); box-shadow: 0 1px 0 var(--line2); }

.apki { max-width: 1240px; margin: 0 auto 10px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.apka-tab { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-l); border: 1px solid var(--line); background: var(--strona2); text-align: left; transition: border-color var(--ruch), background var(--ruch); min-width: 0; }
.apka-tab:hover { border-color: var(--line2); }
.apka-tab[aria-selected="true"] { border-color: var(--ak-linia); background: color-mix(in oklab, var(--strona2) 88%, var(--ak)); }
.apka-tab .kafel { width: 34px; height: 34px; flex: none; }
.apka-tab b { display: block; font-family: var(--f-tytul); font-weight: 400; font-size: 15px; line-height: 1.1; }
.apka-tab small { display: block; color: var(--tx3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.apka-tab .kropka { width: 8px; height: 8px; border-radius: 50%; background: var(--ak); margin-left: auto; flex: none; }
@media (max-width: 860px) { .apki { grid-template-columns: repeat(2, minmax(0,1fr)); } }

.ekrany { max-width: 1240px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ekrany .etyk { color: var(--tx3); font-size: 12px; margin-right: 4px; text-transform: uppercase; letter-spacing: .08em; }
.ekran-tab { border: 1px solid var(--line2); background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--tx2); font-weight: 600; }
.ekran-tab[aria-selected="true"] { background: var(--ak); color: var(--ak-na); border-color: var(--ak); }
.ekrany .wskazowka { margin-left: auto; color: var(--tx3); font-size: 12px; }

.scena { max-width: 1240px; margin: 0 auto; overflow-x: auto; padding: 4px 4px 30px; }

/* ---------- okno apki ---------- */
.okno { position: relative; width: 1200px; height: 760px; margin: 0 auto; border-radius: 12px; overflow: hidden;
  background: color-mix(in oklab, var(--panel) 97%, var(--ak)); border: 1px solid var(--line2); box-shadow: var(--cien);
  display: grid; grid-template-rows: 40px minmax(0,1fr) 28px; }
.okno::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--ak); z-index: 5; }
.pasek-t { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-left: 12px; border-bottom: 1px solid var(--line); background: color-mix(in oklab, var(--wglebienie) 70%, var(--ak) 3%); }
.pasek-t .marka { display: flex; align-items: center; gap: 9px; min-width: 0; }
.pasek-t .marka .kafel { width: 22px; height: 22px; }
.pasek-t .marka b { font-family: var(--f-tytul); font-weight: 400; font-size: 14px; letter-spacing: .01em; }
.pasek-t .marka span { color: var(--tx3); font-size: 12px; }
.szukaj-pill { display: flex; align-items: center; gap: 8px; width: 360px; height: 28px; padding: 0 6px 0 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel2); color: var(--tx3); font-size: 13px; }
.szukaj-pill:hover { border-color: var(--line3); color: var(--tx2); }
.szukaj-pill .kbd { margin-left: auto; }
.kbd { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line2); background: var(--panel); color: var(--tx2); white-space: nowrap; line-height: 1.5; }
.okno-ster { justify-self: end; display: flex; height: 100%; }
.okno-ster span { width: 46px; display: grid; place-items: center; color: var(--tx2); }
.okno-ster span:last-child:hover { background: #c42b1c; color: #fff; }
.cialo { display: grid; grid-template-columns: 64px minmax(0,1fr); min-height: 0; }
.okno.skupienie .cialo { grid-template-columns: 0 minmax(0,1fr); }
.okno.skupienie .szyna { visibility: hidden; }
.szyna { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-right: 1px solid var(--line); background: color-mix(in oklab, var(--wglebienie) 60%, transparent); overflow: hidden; }
.szyna button { width: 52px; padding: 7px 0 5px; border: 0; border-radius: 10px; background: transparent; color: var(--tx3); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; transition: background var(--ruch), color var(--ruch); }
.szyna button:hover { background: var(--panel3); color: var(--tx); }
.szyna button[aria-current="page"] { background: var(--ak-slaby); color: var(--tx); }
.szyna button[aria-current="page"] svg { color: var(--ak); }
.szyna .dol { margin-top: auto; }
.glowny { min-width: 0; min-height: 0; position: relative; overflow: hidden; }
.stan { display: flex; align-items: center; gap: 14px; padding: 0 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--tx3); background: color-mix(in oklab, var(--wglebienie) 70%, transparent); }
.stan .lok { display: inline-flex; align-items: center; gap: 6px; color: var(--tx2); }
.stan .lok i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ok) 22%, transparent); }
.stan .prawo { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.toast { display: inline-flex; align-items: center; gap: 6px; color: var(--tx); }
.toast b { color: var(--ak); font-weight: 700; }

/* ---------- wspólne komponenty ---------- */
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.m { width: 15px; height: 15px; }
.ic.d { width: 22px; height: 22px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: var(--r-m); border: 1px solid var(--line2); background: var(--panel2); font-weight: 700; font-size: 13px; transition: background var(--ruch), border-color var(--ruch), transform 90ms; white-space: nowrap; }
.btn:hover { background: var(--panel3); border-color: var(--line3); }
.btn.cichy { background: transparent; border-color: transparent; color: var(--tx2); }
.btn.cichy:hover { background: var(--panel3); color: var(--tx); }
.btn-wcisk { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 42px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--ak); color: var(--ak-na); font-family: var(--f-tytul); font-weight: 400; font-size: 15px; letter-spacing: .01em; box-shadow: 0 4px 0 var(--ak-polka), 0 10px 24px -10px var(--ak); transition: transform 90ms, box-shadow 90ms, filter var(--ruch); white-space: nowrap; }
.btn-wcisk:hover { filter: brightness(1.06); }
.btn-wcisk:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ak-polka); }
.btn-wcisk .kbd { background: color-mix(in oklab, var(--ak-na) 14%, transparent); border-color: color-mix(in oklab, var(--ak-na) 30%, transparent); color: var(--ak-na); font-size: 10.5px; }
.lcd { font-family: var(--f-mono); font-variant-numeric: tabular-nums; background: var(--lcd); color: var(--akd); border-radius: 8px; padding: 6px 10px; box-shadow: inset 0 2px 6px rgba(0,0,0,.6), inset 0 0 0 1px var(--lcd-line); letter-spacing: .02em; white-space: nowrap;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
.lcd .sz { color: #8a8590; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; font-size: 12.5px; font-weight: 600; color: var(--tx2); white-space: nowrap; }
.chip:hover { border-color: var(--line3); color: var(--tx); }
.chip[aria-pressed="true"] { background: var(--ak-slaby); border-color: var(--ak-linia); color: var(--tx); }
.chip .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--tx3); }
.chip[aria-pressed="true"] .n { color: var(--ak); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--wglebienie); border: 1px solid var(--line); gap: 2px; }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 11px; border-radius: 7px; font-size: 12.5px; font-weight: 700; color: var(--tx3); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button:hover { color: var(--tx); }
.seg button[aria-pressed="true"] { background: var(--panel3); color: var(--tx); box-shadow: 0 1px 0 var(--line2), inset 0 0 0 1px var(--line); }
.seg button[aria-pressed="true"] svg { color: var(--ak); }
.przel { width: 34px; height: 20px; border-radius: 999px; border: 0; background: var(--panel3); position: relative; flex: none; box-shadow: inset 0 0 0 1px var(--line2); transition: background var(--ruch); padding: 0; }
.przel::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--tx2); transition: transform var(--ruch), background var(--ruch); }
.przel[aria-checked="true"] { background: var(--ak); box-shadow: none; }
.przel[aria-checked="true"]::after { transform: translateX(14px); background: var(--ak-na); }
.etyk-s { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--tx3); font-weight: 700; }
.panel { background: color-mix(in oklab, var(--panel2) 92%, var(--ak) 2%); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.panel-g { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.panel-g h3 { margin: 4px 0 0; font-size: 15px; font-weight: 800; }
.panel-s { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; flex: 1; }
.panel-d { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.tytul-ekr { font-family: var(--f-tytul); font-weight: 400; font-size: 22px; margin: 0; line-height: 1.1; }
.przewin { overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line3) transparent; }
.baner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-m); background: color-mix(in oklab, var(--warn) 12%, transparent); border: 1px solid color-mix(in oklab, var(--warn) 35%, transparent); font-size: 12.5px; color: var(--tx); }
.baner svg { color: var(--warn); margin-top: 1px; }
.wiersz-op { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
.wiersz-op span { color: var(--tx2); }

/* ================= SoraFlux ================= */
.flux { display: grid; grid-template-columns: minmax(0,1fr) 340px; height: 100%; }
.flux-lewa { display: grid; grid-template-rows: auto auto minmax(0,1fr) auto; min-height: 0; }
.wejscie { margin: 16px 18px 8px; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 16px; border-radius: 14px; border: 1.5px dashed var(--line3); background: var(--wglebienie); transition: border-color var(--ruch), background var(--ruch); }
.wejscie:focus-within { border-style: solid; border-color: var(--ak); background: color-mix(in oklab, var(--wglebienie) 90%, var(--ak)); }
.wejscie input { flex: 1; border: 0; background: transparent; outline: none; font-size: 14px; min-width: 0; }
.wejscie input::placeholder { color: var(--tx3); }
.wejscie > svg { color: var(--ak); }
.tasma-g { display: flex; align-items: center; gap: 8px; padding: 6px 18px 10px; }
.tasma-g h2 { margin: 0 8px 0 0; font-size: 15px; font-weight: 800; }
.tasma-g .prawo { margin-left: auto; display: flex; gap: 6px; }
.lista { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.poz { display: grid; grid-template-columns: 56px minmax(0,1fr) auto auto 28px; align-items: center; gap: 14px; padding: 9px 10px 9px 9px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); position: relative; overflow: hidden; text-align: left; width: 100%; }
.poz:hover { border-color: var(--line2); }
.poz[aria-selected="true"] { border-color: var(--ak-linia); background: color-mix(in oklab, var(--panel) 90%, var(--ak)); }
.poz .min { width: 56px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: #fff; position: relative; overflow: hidden; }
.poz .min svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
.poz .nazwa { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.poz .meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.poz .przepis { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--ak-slaby); color: var(--tx); font-size: 12px; font-weight: 700; white-space: nowrap; }
.poz .przepis svg { color: var(--ak); }
.poz .lcd { font-size: 12px; padding: 5px 9px; }
.poz .tor { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--ak); width: 0; transition: width 300ms linear; }
.poz .status { font-size: 11.5px; font-weight: 700; color: var(--tx3); }
.poz .status.ok { color: var(--ok); }
.poz .status.trwa { color: var(--ak); }
.poz .wiecej { color: var(--tx3); display: grid; place-items: center; }
.transport { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-top: 1px solid var(--line); background: color-mix(in oklab, var(--wglebienie) 80%, transparent); }
.transport .suma { display: flex; flex-direction: column; gap: 2px; }
.transport .suma small { color: var(--tx3); font-size: 11.5px; }
.transport .sel { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.transport .sel small { color: var(--tx3); font-size: 11px; }
.transport .sel b { display: inline-flex; gap: 4px; align-items: center; font-weight: 700; }
.transport .btn-wcisk { margin-left: auto; }
.karty-p { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.karta-p { text-align: left; padding: 11px 11px 10px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel); display: flex; flex-direction: column; gap: 4px; transition: border-color var(--ruch), background var(--ruch); min-width: 0; }
.karta-p:hover { border-color: var(--line3); }
.karta-p[aria-pressed="true"] { border-color: var(--ak); background: color-mix(in oklab, var(--panel) 86%, var(--ak)); box-shadow: inset 0 0 0 1px var(--ak); }
.karta-p .g { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 13px; }
.karta-p .g svg { color: var(--ak); }
.karta-p small { color: var(--tx3); font-size: 11.5px; line-height: 1.35; }
.karta-p .est { font-family: var(--f-mono); font-size: 11.5px; color: var(--tx2); }
.wskaznik { padding: 14px; border-radius: 14px; background: var(--lcd); box-shadow: inset 0 2px 8px rgba(0,0,0,.6), inset 0 0 0 1px var(--lcd-line); color: #d9d4d7;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px); }
.wskaznik .liczby { display: flex; align-items: baseline; gap: 10px; font-family: var(--f-mono); }
.wskaznik .przed { color: #8a8590; font-size: 15px; text-decoration: line-through; text-decoration-color: rgba(255,255,255,.25); }
.wskaznik .po { color: var(--akd); font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.wskaznik .proc { margin-left: auto; color: var(--akd); font-size: 13px; }
.wskaznik .slupki { display: grid; gap: 5px; margin-top: 10px; }
.wskaznik .slupek { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); }
.wskaznik .slupek.po-s { background: var(--akd); transition: width 300ms; }
.wskaznik .opis { margin-top: 8px; font-size: 11.5px; color: #9d979b; font-family: var(--f-mono); }
details.dost { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }

    case "czyt-chrome": if (S.czyt.aa || S.czyt.pop || S.czyt.slownik || S.czyt.szuflada) { S.czyt.aa = S.czyt.pop = S.czyt.slownik = S.czyt.szuflada = false; } else S.czyt.bez = !S.czyt.bez; break;
    case "czyt-rozm": S.czyt.rozm = Math.max(14, Math.min(28, S.czyt.rozm + +t.dataset.d)); break;
    case "czyt-mot": S.czyt.mot = id; break;
    case "czyt-pion": S.czyt.pion = !S.czyt.pion; break;
    case "czyt-tylko": S.czyt.tylko = !S.czyt.tylko; break;
    case "czyt-reset": Object.assign(S.czyt, { mot: "papier", rozm: 19, inter: 1.65, szer: 34, pion: false }); break;
    case "czyt-inter": case "czyt-szer": return;
    default: if (!v2(a, t, ev, id, i)) return;
  }
  render();
});
document.addEventListener("change", ev => { if (ev.target.id === "mot-baza") { S.motywBaza = ev.target.value; render(); } });
try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => render()); } catch (e) { }

  if (ev.target.id === "czyt-inter") { S.czyt.inter = +ev.target.value; const c = $(".czyt"); c.style.setProperty("--inter", S.czyt.inter); ev.target.nextElementSibling.textContent = S.czyt.inter.toFixed(2); }

});
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && (ev.key === "=" || ev.key === "+" || ev.key === "-")) { ev.preventDefault(); S.skala = Math.max(0.9, Math.min(1.5, Math.round((S.skala + (ev.key === "-" ? -0.1 : 0.1)) * 100) / 100)); render(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); S.paleta = !S.paleta; S.palQ = ""; S.palI = 0; render(); return; }
  if (S.paleta) {
    const L = polecenia();
    if (ev.key === "Escape") { S.paleta = false; render(); }
    else if (ev.key === "ArrowDown") { ev.preventDefault(); S.palI = Math.min(L.length - 1, S.palI + 1); render(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); S.palI = Math.max(0, S.palI - 1); render(); }
    else if (ev.key === "Enter") { ev.preventDefault(); const x = L[S.palI]; S.paleta = false; x?.run(); render(); }
    return;
  }
  if (ev.target.matches("input")) { if (ev.target.id === "flux-link" && ev.key === "Enter" && ev.target.value.trim()) { POZ.push({ n: ev.target.value.trim().replace(/^https?:\/\//, "").slice(0, 40) + " (link)", m: "pobieranie z linku", mb: 180, p: "telefon", typ: "link", g: "linear-gradient(135deg,#22223b,#4a4e69)", pobiera: 1 }); postep.push(1); S.flux.wybrana = POZ.length - 1; render(); } return; }
  if (S.app === "pdf" && S.ekran.pdf === "biurko" && /^[1-5]$/.test(ev.key)) { S.pdf.narz = ["polacz", "podziel", "obroc", "zmniejsz", "chron"][+ev.key - 1]; render(); }

  if (S.app === "shot" && S.ekran.shot === "nakladka" && ev.key === "Enter") { S.shot.zrobiony = true; render(); }
});

  S.pdf.ciagnie = null; S.pdf.zazn = new Set([do_ >= z ? do_ : do_ + 1]); S.toast = `Strona przeniesiona na pozycję ${(do_ >= z ? do_ : do_ + 1) + 1}`; render(); });
